<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fabio Pulito — Foundry Workshop</title>
  <meta name="description" content="Foundry Workshop — downloadable tools. AI software from written specs, built async." />
  <meta name="author" content="Fabio Pulito" />
  <link rel="alternate" hreflang="en" href="https://workshop.fabiopulito.com/en/" />
  <link rel="alternate" hreflang="it" href="https://workshop.fabiopulito.com/it/" />
  <link rel="alternate" hreflang="x-default" href="https://workshop.fabiopulito.com/en/" />
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #111111;
      --accent-muted: #666666;
      --border-color: #e0e0e0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 48px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 4px;
    }

    .site-name {
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 13px;
      color: var(--accent-muted);
    }

    .lang-switch select {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent-muted);
      background-color: transparent;
      border: none;
      border-bottom: 1px solid var(--border-color);
      border-radius: 0;
      padding: 2px 0;
      cursor: pointer;
      max-width: 9.5em;
    }

    .lang-switch select:hover,
    .lang-switch select:focus {
      color: var(--text-color);
      border-bottom-color: var(--text-color);
      outline: none;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 16px 0 12px;
      letter-spacing: -0.5px;
    }

    .lede {
      font-size: 15px;
      margin: 0 0 28px;
      color: var(--text-color);
    }

    ul.tools {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    ul.tools li {
      margin: 0 0 0.85rem;
      font-size: 15px;
    }

    a {
      color: var(--text-color);
    }

    .meta {
      color: var(--accent-muted);
    }

    .meta a {
      color: var(--accent-muted);
    }

    footer {
      margin-top: 48px;
      font-size: 14px;
      color: var(--accent-muted);
      line-height: 1.45;
    }

    footer a {
      color: var(--accent-muted);
    }

    .copyright {
      margin-top: 48px;
      font-size: 12px;
      color: var(--accent-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="top-bar">
        <span class="site-name">Fabio Pulito</span>
        <div class="lang-switch">
          <select aria-label="Language">
            <option value="../en/" selected>English</option>
            <option value="../it/">Italiano</option>
          </select>
        </div>
      </div>
      <h1>Foundry Workshop</h1>
      <p class="lede">
        Downloadable tools from the Foundry practice. Each page has the installer and first-open notes.
      </p>
    </header>

    <ul class="tools">
      <li>
        <a href="/blog-translator/">Blog Translator</a>
        <span class="meta">
          — Mac (Intel / Rosetta) ·
          <a href="https://github.com/pulfabio/blog-translator-downloads/releases">Releases</a>
        </span>
      </li>
    </ul>

    <footer>
      <a href="https://foundry.fabiopulito.com/en/">Foundry</a>
      — AI software from written specs, built async.
    </footer>

    <p class="copyright">© 2026 Fabio Pulito</p>
  </div>

  <script>
  (function () {
    var sel = document.querySelector('.lang-switch select');
    if (!sel) return;
    var initial = sel.value;
    var suppressChange = false;

    function go() {
      var next = sel.value;
      if (!next || next === initial) return;
      window.location.href = next;
    }

    sel.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'Home' || e.key === 'End' || e.key === 'PageUp' || e.key === 'PageDown') {
        suppressChange = true;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        go();
      }
    });

    sel.addEventListener('change', function () {
      if (suppressChange) {
        suppressChange = false;
        return;
      }
      go();
    });

    sel.addEventListener('blur', function () {
      go();
    });
  })();
  </script>
</body>
</html>
